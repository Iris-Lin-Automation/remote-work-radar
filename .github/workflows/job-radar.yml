name: Remote Work Radar — 定时扫描 + Telegram 推送

# ─────────────────────────────────────────────────────────────
# 触发条件
# ─────────────────────────────────────────────────────────────
on:
  # 每 2 小时一次（GitHub 免费额度下 */20 经常被跳过/延迟，看起来像「一天一条」）
  schedule:
    - cron: '0 */2 * * *'

  # 允许手动点击「Run workflow」按钮触发（调试时很有用）
  workflow_dispatch:
    inputs:
      send_heartbeat:
        description: '无新帖时是否发送心跳消息到 Telegram'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']
      replay:
        description: '忽略已见记录，把最近7天可投岗位再推一遍'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      track:
        description: '扫描轨道：both=中英分开 / en=只英文海外主推 / cn=只中文副线'
        required: false
        default: 'both'
        type: choice
        options: ['both', 'en', 'cn']

# ─────────────────────────────────────────────────────────────
# 权限：需要写入仓库（用于提交 seen_jobs.json）
# ─────────────────────────────────────────────────────────────
permissions:
  contents: write

jobs:
  scan-and-notify:
    name: 扫描新岗位并推送
    runs-on: ubuntu-latest
    timeout-minutes: 10   # 单次最多跑 10 分钟，防止卡死占用额度

    steps:
      # ── Step 1: Checkout 代码（带写入凭据，用于后面的 git push）
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 使用带写权限的 token（默认 GITHUB_TOKEN 即可）
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 2: 设置 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 缓存 node_modules，加速后续运行
          cache: 'npm'

      # ── Step 3: 安装依赖（只安装 production 依赖，节省时间）
      - name: Install dependencies
        run: npm ci --omit=dev

      # ── Step 4: 确保 data/ 目录存在
      - name: Ensure data directory exists
        run: mkdir -p data

      # ── Step 5: 运行主扫描脚本
      - name: Run radar cycle
        env:
          # ── 必填 Secrets
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}

          # ── Groq 极速 AI 打分（推荐填，免费）
          # 不填则跳过 AI 打分，仅靠关键词过滤
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

          # ── 双轨：both=中英分开跑；en/cn=只跑一轨。主推永远是英文海外优质团队
          RADAR_TRACK: ${{ github.event.inputs.track || 'both' }}
          RADAR_PRIMARY: "en"
          # EN 50 太严 → 整轮常推 0；先 40，仍踢签证/地区锁/渣岗
          RADAR_EN_THRESHOLD: "40"
          RADAR_CN_THRESHOLD: "40"
          RADAR_EN_DETAIL_SCORE: "60"
          RADAR_CN_DETAIL_SCORE: "75"

          # ── 时间窗口
          RADAR_MAX_AGE_HOURS: "24"

          # ── 可选：额外关键词
          RADAR_KEYWORDS: ${{ secrets.RADAR_KEYWORDS }}

          TELEGRAM_SEND_HEARTBEAT: ${{ github.event.inputs.send_heartbeat || 'false' }}
          RADAR_DAILY_DIGEST: "true"
          RADAR_REPLAY: ${{ github.event.inputs.replay || 'false' }}
        run: node scripts/run-radar-cycle.js

      # ── Step 6: 把更新的 seen_jobs.json 提交回仓库
      #    [skip ci] 标记阻止此提交再次触发 workflow
      - name: Commit updated seen_jobs.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # -f 强制跳过 gitignore；--cached 检测暂存区变化（兼容新文件和修改）
          git add -f data/seen_jobs.json data/pushed_jobs.json
          if git diff --cached --quiet; then
            echo "seen_jobs.json 没有变化，跳过提交"
          else
            git commit -m "chore: update seen jobs [skip ci]"
            git push
            echo "✅ seen_jobs.json 已提交"
          fi
